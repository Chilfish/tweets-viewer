name: Probe proxy (temporary)

# 临时验证：runner 经 mihomo 代理能否访问 X。
# 只做只读探针，不写数据库；验证完成后连同 apps/scripts/src/probe-proxy.ts 一起删除。
# push 触发仅限本分支，方便在 PR 上直接验证；收尾时改回仅 workflow_dispatch。
on:
  workflow_dispatch:
  push:
    branches: [fix/tweet-fetch-proxy-egress]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Start mihomo
        env:
          MIHOMO_CONFIG_B64: ${{ secrets.MIHOMO_CONFIG_B64 }}
        run: |
          set -euo pipefail
          VERSION=v1.19.30
          mkdir -p /tmp/mihomo
          curl -sSL -o /tmp/mihomo/core.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz"
          gunzip -f /tmp/mihomo/core.gz
          chmod +x /tmp/mihomo/core
          echo "$MIHOMO_CONFIG_B64" | base64 -d > /tmp/mihomo/config.yaml
          nohup /tmp/mihomo/core -d /tmp/mihomo -f /tmp/mihomo/config.yaml > /tmp/mihomo/core.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9099/version > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9099/version

      - name: Probe each node
        env:
          TWEET_KEYS: ${{ secrets.TWEET_KEYS }}
          TWEET_PROXY: http://127.0.0.1:7890
        run: |
          set -uo pipefail
          nodes=$(curl -s http://127.0.0.1:9099/proxies/PICK | jq -r '.all[]')
          echo "candidates: $(echo "$nodes" | tr '\n' ' ')"
          for node in $nodes; do
            curl -s -X PUT -H 'Content-Type: application/json' \
              -d "{\"name\":\"$node\"}" http://127.0.0.1:9099/proxies/PICK > /dev/null
            echo "===== $node ====="
            printf '  exit-ip: '
            curl -s --max-time 20 -x "$TWEET_PROXY" https://api.ipify.org || printf '(failed)'
            printf '\n  x.com/home: '
            curl -s --max-time 25 -o /dev/null -w '%{http_code}\n' -x "$TWEET_PROXY" https://x.com/home || true
            bun run apps/scripts/src/probe-proxy.ts || true
            echo
          done

      - name: Dump mihomo log
        if: failure() || cancelled()
        run: tail -n 100 /tmp/mihomo/core.log || true

      - name: Stop mihomo
        if: always()
        run: pkill -f '/tmp/mihomo/core' || true
