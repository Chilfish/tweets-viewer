name: CI

on:
  push:
    branches: [main]
  pull_request: # 手动触发：PR 经合并 API 合入时不触发 push 事件，可用它补跑 main 的验证

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Lint
        run: bunx eslint . --max-warnings=0

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Typecheck web-react
        run: bun --cwd apps/web-react typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Build client
        run: bun run build:client

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Test shared
        run: bun --cwd packages/shared test
      - name: Test database
        run: bun --cwd packages/database test
      - name: Test server
        run: bun --cwd apps/server test
      - name: Test web-react
        run: bun --cwd apps/web-react test
