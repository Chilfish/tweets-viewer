name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Lint
        run: bunx eslint . --max-warnings=0

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Typecheck web-react
        run: bun --cwd apps/web-react typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Build client
        run: bun run build:client

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Test shared
        run: bun --cwd packages/shared test
      - name: Test database
        run: bun --cwd packages/database test
      - name: Test server
        run: bun --cwd apps/server test
      - name: Test web-react
        run: bun --cwd apps/web-react test

  # 视觉回归门禁（VRT）：环境必须与 update-screenshots.yml 严格同构
  # （runner / playwright 安装 / CJK 字体三者任一不同 → 基线像素级不匹配 → 永久红）
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps --only-shell
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Visual regression tests
        run: bun --cwd apps/web-react run test:visual
